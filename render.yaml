services:
  - type: web
    name: iching-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: iching_db
      - key: JWT_SECRET
        sync: false                # genera con: openssl rand -base64 48
      - key: ADMIN_SECRET
        sync: false                # genera con: openssl rand -hex 32
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false                # whsec_… del webhook Stripe LIVE
      - key: STRIPE_API_KEY
        sync: false                # sk_live_… per produzione, sk_test_… per staging
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false                # opzionale, default whitelist OK
      - key: ADMIN_EMAILS
        sync: false                # CSV di email admin (whitelist premium)
      - key: SENTRY_DSN
        sync: false                # opzionale: attiva error tracking
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: RESEND_REPLY_TO
        sync: false                # opzionale: reply-to header sulle email
      - key: RESEND_API_KEY
        sync: false                # re_xxx... (Dashboard Resend → API Keys)
      - key: RESEND_FROM_EMAIL
        value: "I Ching del Benessere <noreply@chingbenessere.it>"
      - key: APP_URL
        value: https://www.chingbenessere.it
      - key: PYTHON_VERSION
        value: 3.11.0
