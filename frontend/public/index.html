<!doctype html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#1a1a2e" />
        <meta name="description" content="I Ching del Benessere - L'antica saggezza cinese per il benessere moderno" />

        <!--
          Content Security Policy
          =======================
          Whitelist esplicita dei domini da cui il browser puo' caricare risorse.
          Restringe enormemente l'impatto di un eventuale XSS: anche se un
          attaccante riesce a iniettare uno <script>, il browser si rifiuta di
          eseguirlo da domini non whitelisted.

          script-src: bundle proprio + Google Sign-In + Stripe.js (carta).
          connect-src: API backend + Google + Stripe + Sentry (se configurato).
          frame-src: Stripe (3DS) + Google Sign-In iframe.
          img-src: tutto via https + data: URI (icone inline).
          style-src: 'unsafe-inline' perche' Radix UI e Tailwind JIT generano
            stili inline; sarebbe il vettore CSP piu' forte, ma rimuoverlo
            richiede refactor consistente — accettiamo questo trade-off.
        -->
        <meta http-equiv="Content-Security-Policy" content="
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval'
            https://accounts.google.com
            https://apis.google.com
            https://js.stripe.com
            https://*.sentry.io;
          style-src 'self' 'unsafe-inline'
            https://fonts.googleapis.com;
          font-src 'self' data:
            https://fonts.gstatic.com;
          img-src 'self' data: blob:
            https: ;
          connect-src 'self'
            https://iching-backend-ac3n.onrender.com
            https://accounts.google.com
            https://oauth2.googleapis.com
            https://api.stripe.com
            https://*.ingest.sentry.io
            https://*.ingest.de.sentry.io
            https://*.ingest.us.sentry.io;
          frame-src 'self'
            https://accounts.google.com
            https://js.stripe.com
            https://hooks.stripe.com;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none';
          upgrade-insecure-requests;
        " />

        <!-- Referrer policy: niente URL/query a domini terzi -->
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <!-- Performance: open the connection to the backend & Google Fonts
             during HTML parsing so the first API call and font load are
             ~200-400ms faster on slow networks. -->
        <link rel="preconnect" href="https://iching-backend-ac3n.onrender.com" crossorigin />
        <link rel="dns-prefetch" href="https://iching-backend-ac3n.onrender.com" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="dns-prefetch" href="https://accounts.google.com" />

        <!-- Initial paint background = avoid flash of white on load. -->
        <style>
            html, body {
                background: #F9F7F2;
                color: #2C2C2C;
                font-family: 'Manrope', system-ui, -apple-system, sans-serif;
                margin: 0;
                min-height: 100vh;
            }
            #root:empty::before {
                content: '';
                display: block;
                width: 32px;
                height: 32px;
                border: 2px solid #C44D38;
                border-top-color: transparent;
                border-radius: 50%;
                animation: app-spin 0.8s linear infinite;
                margin: 40vh auto;
            }
            @keyframes app-spin { to { transform: rotate(360deg); } }
        </style>

        <title>I Ching del Benessere</title>
    </head>
    <body>
        <noscript>Per usare l'app è necessario abilitare JavaScript.</noscript>
        <div id="root"></div>
        <!-- Fire-and-forget warmup ping: wakes the Render free-tier service
             in parallel with the React bundle download. -->
        <script>
            (function() {
                try {
                    fetch('https://iching-backend-ac3n.onrender.com/ping', { mode: 'cors', cache: 'no-store' })
                        .catch(function(){});
                } catch (_) {}
            })();
        </script>
    </body>
</html>
